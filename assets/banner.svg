<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .node-label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    /* CSS Animations for dynamic aspects */
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translate(280px) rotate(0deg); }
      100% { transform: rotate(360deg) translate(280px) rotate(-360deg); }
    }

    .pulse-dot {
      animation: pulseParticle 3s infinite ease-in-out;
    }
    .flow-dash {
      stroke-dasharray: 8, 8;
      animation: flowLine 1.5s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="320" fill="url(#grid)" />
  </g>

  <!-- DYNAMIC BACKGROUND GRAPHICS (Behind Text) -->
  <g opacity="0.25">
    <!-- Connecting network lines in background -->
    <path d="M 150 260 Q 350 290 600 260 T 1050 260" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-dash" />
    <path d="M 100 80 Q 400 30 700 80 T 1100 80" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-dash" />
    
    <!-- Background Animated Glow Nodes -->
    <circle cx="150" cy="260" r="6" fill="#38bdf8" class="pulse-dot" />
    <circle cx="600" cy="260" r="8" fill="#818cf8" class="pulse-dot" style="animation-delay: 1s;" />
    <circle cx="1050" cy="260" r="6" fill="#c084fc" class="pulse-dot" style="animation-delay: 2s;" />
    <circle cx="950" cy="70" r="7" fill="#06b6d4" class="pulse-dot" style="animation-delay: 0.5s;" />
    <circle cx="250" cy="60" r="5" fill="#38bdf8" class="pulse-dot" style="animation-delay: 1.5s;" />
  </g>

  <!-- FOREGROUND CONTENT: Header Tag -->
  <g transform="translate(80, 50)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" class="pulse-dot" />
    <text x="34" y="21" class="badge-text">AWESOME CURATED LIST</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always Clear and Visible) -->
  <text x="80" y="135" class="title" filter="url(#glow)">Awesome Data Virtualization ⚡</text>
  <text x="80" y="175" class="subtitle">Curated collection of Data Virtualization platforms, Federated SQL engines &amp; Semantic Layers</text>

  <!-- DATA VIRTUALIZATION ARCHITECTURE VISUAL (Bottom Foreground Pill Badges) -->
  <g transform="translate(80, 220)">
    <!-- Source Data Node 1 -->
    <rect x="0" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="65" y="24" text-anchor="middle" class="node-label">🗄️ Databases</text>

    <!-- Source Data Node 2 -->
    <rect x="145" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="210" y="24" text-anchor="middle" class="node-label">❄️ Data Lakes</text>

    <!-- Connector Arrow -->
    <path d="M 285 19 L 325 19" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" class="flow-dash" />

    <!-- Virtualization Core Pill -->
    <rect x="335" y="-5" width="220" height="48" rx="10" fill="url(#cyanPurple)" />
    <text x="445" y="25" text-anchor="middle" class="node-label" font-size="14" font-weight="700" fill="#ffffff">⚡ Data Virtualization Layer</text>

    <!-- Connector Arrow -->
    <path d="M 565 19 L 605 19" fill="none" stroke="#c084fc" stroke-width="2" class="flow-dash" />

    <!-- Target Node 1 -->
    <rect x="615" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="680" y="24" text-anchor="middle" class="node-label">📊 Analytics / BI</text>

    <!-- Target Node 2 -->
    <rect x="760" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="825" y="24" text-anchor="middle" class="node-label">🤖 AI / LLM Apps</text>
  </g>
</svg>
